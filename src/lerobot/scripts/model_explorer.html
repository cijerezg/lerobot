<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model explorer</title>
<script src="/static/plotly.min.js"></script>
<style>
  :root { --bg:#0e1013; --panel:#171a1f; --panel2:#1e2229; --line:#272c35; --fg:#e3e6eb; --dim:#8b93a1; --acc:#4f9cff; --acc2:#7ee787; --warn:#ffb454; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 Inter, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:5; display:flex; gap:16px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); background:rgba(23,26,31,.92); backdrop-filter:blur(6px); flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0 8px 0 0; font-weight:600; letter-spacing:.01em; }
  header .ckpt { color:var(--dim); font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px; }
  main { display:grid; grid-template-columns: minmax(0, 1.55fr) minmax(380px, 1fr); gap:14px; padding:14px 18px 40px; }
  .col { display:flex; flex-direction:column; gap:14px; min-width:0; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.25); }
  section h2 { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim); margin:0 0 10px; font-weight:600; display:flex; gap:10px; align-items:baseline; }
  section h2 .small { text-transform:none; letter-spacing:0; font-weight:400; }
  label { color:var(--dim); }
  select, input[type=text], input[type=number], textarea, button { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--acc); }
  textarea { width:100%; resize:vertical; }
  button { cursor:pointer; transition: background .12s; }
  button:hover { background:#262b34; }
  button.primary { background:var(--acc); color:#04101f; border-color:var(--acc); font-weight:600; }
  button.primary:hover { background:#6aacff; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:5px 0; }
  .row > label:first-child { min-width:64px; }
  .cams { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap:10px; }
  .cam { position:relative; }
  .cam canvas { width:100%; aspect-ratio:1; background:#000; border-radius:8px; display:block; }
  .cam .name, .cam .peak { position:absolute; top:6px; font-size:11px; color:#fff; text-shadow:0 0 4px #000, 0 0 2px #000; font-family:ui-monospace, monospace; }
  .cam .name { left:8px; } .cam .peak { right:8px; }
  .timeline { margin-top:12px; }
  .timeline canvas { width:100%; height:28px; display:block; border-radius:6px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  #scene { width:100%; height:440px; }
  .panels { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .panels > div { height:190px; }
  details { margin-top:8px; } summary { cursor:pointer; color:var(--dim); font-size:12px; }
  .charts { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:8px; margin-top:8px; }
  .chart canvas { width:100%; height:110px; display:block; background:var(--panel2); border-radius:6px; }
  .chart .t { font-size:11px; color:var(--dim); margin-bottom:2px; }
  .tokens { line-height:1.95; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  .tok { display:inline-block; padding:0 4px; margin:1px; border-radius:4px; white-space:pre; color:#fff; }
  .budget { font-family:ui-monospace, monospace; font-size:11px; }
  .bar { display:flex; height:13px; margin:2px 0 6px; background:var(--panel2); border-radius:3px; overflow:hidden; }
  .bar span { display:block; height:100%; }
  .legend span { display:inline-block; margin-right:12px; }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:-1px; border-radius:2px; }
  .status { color:var(--dim); font-size:12px; min-height:1.4em; }
  .status.err { color:var(--bad); }
  .kv { font-family:ui-monospace, monospace; font-size:11px; color:var(--dim); word-break:break-word; }
  .small { font-size:11px; color:var(--dim); }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); font-size:11px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Model explorer</h1>
  <span class="ckpt" id="ckpt"></span>
  <label>dataset <select id="ds"></select></label>
  <label>episode <select id="ep"></select></label>
  <span class="status" id="status"></span>
</header>
<main>
  <div class="col">
    <section>
      <div class="cams" id="cams"></div>
      <div class="timeline">
        <canvas id="bands"></canvas>
        <input type="range" id="slider" min="0" max="0" step="1" value="0">
        <div class="row">
          <button id="play">play</button>
          <span class="kv" id="frameLabel"></span>
          <span class="small">← → step one stride · space plays</span>
          <span style="flex:1"></span>
          <label><input type="checkbox" id="overlayOn" checked> attention overlay</label>
          <label>head <select id="head"></select></label>
          <label>blend <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.5" style="width:80px"></label>
        </div>
      </div>
    </section>
    <section>
      <h2>Action trace <span class="small" id="chunkNote"></span></h2>
      <div id="scene"></div>
      <div class="panels"><div id="wristPanel"></div><div id="gripPanel"></div></div>
      <div class="legend small" style="margin-top:6px" id="chartLegend"></div>
      <details><summary>all joints</summary><div class="charts" id="charts"></div></details>
    </section>
    <section>
      <h2>Prompt tokens <span class="small" id="tokNote"></span></h2>
      <div class="tokens" id="tokens"></div>
    </section>
  </div>
  <div class="col">
    <section>
      <h2>Prompt</h2>
      <div class="row"><label>task</label><textarea id="task" rows="2"></textarea></div>
      <div class="row"><label>subtask</label><input type="text" id="subtask" list="vocab" style="flex:1"><datalist id="vocab"></datalist></div>
      <div class="row"><label></label><label><input type="checkbox" id="subtaskOn" checked> subtask clause</label>
        <button id="gen">generate subtask</button></div>
      <div class="row"><label></label><span class="kv" id="genOut"></span></div>
      <div class="row"><label>metadata</label>
        <label><input type="checkbox" id="metaOn" checked> clause</label>
        <label>quality <select id="quality"></select></label>
        <label>speed <select id="speed"></select></label>
        <label><input type="checkbox" id="mistake"> mistake</label>
      </div>
      <div class="row"><label></label>
        <button id="metaDeploy" title="quality 5, no mistake, speed 5">deployment values</button>
        <button id="metaDataset" title="the labels this frame trained with">dataset values</button>
      </div>
      <div class="row"><label></label>
        <label><input type="checkbox" id="lock"> keep my edits while scrubbing</label>
        <button id="reset">reset to dataset</button></div>
      <div class="kv" id="dsPrompt"></div>
    </section>
    <section>
      <h2>Forward</h2>
      <div class="row">
        <label>seeds</label><input type="number" id="seeds" min="1" max="16" value="1" style="width:64px">
        <label>layer</label><select id="actionLayer"></select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="fast"> FAST decode</label>
        <label title="run the model after every slider move or prompt edit; off = only the button"><input type="checkbox" id="auto" checked> live</label>
        <span style="flex:1"></span>
        <button class="primary" id="predict">predict</button>
      </div>
      <div class="status" id="predStatus"></div>
    </section>
    <section>
      <h2>Attention budget <span class="small" id="budgetNote"></span></h2>
      <div class="legend small" id="budgetLegend"></div>
      <div class="budget" id="budget"></div>
    </section>
    <section>
      <h2>State</h2>
      <div class="kv" id="state"></div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const S = { meta:null, ds:null, ep:null, epInfo:null, frame:0, fd:null, pred:null, token:null, playing:false, gen:0,
            inflight:false, dirty:false, camImgs:{} };
const SEED_COLORS = ['#4f9cff','#ff7b72','#7ee787','#d2a8ff','#ffa657','#79c0ff','#f778ba','#a5d6ff','#e3b341','#56d364','#ff9bce','#8ddb8c','#c297ff','#ffdf5d','#6cb6ff','#ffab70'];
const GROUP_COLORS = { img_external_0:'#4f9cff', img_external_1:'#3d7bd9', img_wrist_0:'#7ee787', depth:'#ffa657', prompt:'#d2a8ff', other:'#4a505b' };
const GT_COLOR = '#f2f4f7', NOW_COLOR = '#ff4fa3', FAST_COLOR = '#D97706';
const PLOT_FONT = { color: '#c9ced6', family: 'Inter, system-ui, sans-serif', size: 11 };

function setStatus(msg, err) { const e = $('status'); e.textContent = msg || ''; e.className = 'status' + (err ? ' err' : ''); }
async function getJSON(url) { const r = await fetch(url); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }
async function postJSON(url, body) { const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)}); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }
function fill(sel, items, value) { sel.innerHTML = ''; for (const [v, t] of items) { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); } if (value !== undefined) sel.value = value; }

// ── JET colormap (matches cv2.COLORMAP_JET used by the attention probe) ────
function jet(t) { t = Math.min(Math.max(t, 0), 1); const c = v => Math.min(Math.max(v, 0), 1) * 255;
  return [c(1.5 - Math.abs(4 * t - 3)), c(1.5 - Math.abs(4 * t - 2)), c(1.5 - Math.abs(4 * t - 1))]; }

// ── init ──────────────────────────────────────────────────────────────────
async function init() {
  S.meta = await getJSON('/api/meta');
  $('ckpt').textContent = S.meta.checkpoint;
  fill($('ds'), S.meta.datasets.map(d => [d, d]));
  fill($('actionLayer'), [...Array(S.meta.n_action_layers).keys()].map(i => [i, i]), 9);
  fill($('quality'), [1,2,3,4,5].map(i => [i, i]), 5);
  fill($('speed'), [1,2,3,4,5].map(i => [i, i]), 5);
  $('vocab').innerHTML = S.meta.subtask_vocab.map(v => `<option value="${v.replace(/"/g,'&quot;')}">`).join('');
  fillHeads();
  $('slider').step = S.meta.stride;
  $('ds').onchange = () => loadDataset($('ds').value);
  $('ep').onchange = () => loadEpisode(parseInt($('ep').value));
  $('slider').oninput = () => setFrame(parseInt($('slider').value));
  $('play').onclick = togglePlay;
  $('predict').onclick = () => { S.dirty = true; runPredict(); };
  $('gen').onclick = generateSubtask;
  $('reset').onclick = () => { $('lock').checked = false; applyDatasetPrompt(); schedulePredict(); };
  $('metaDeploy').onclick = () => { setMeta(S.meta.deployment_metadata); $('lock').checked = true; schedulePredict(); };
  $('metaDataset').onclick = () => { if (S.fd && S.fd.dataset_metadata) { setMeta(S.fd.dataset_metadata); $('lock').checked = true; schedulePredict(); } };
  for (const id of ['task','subtask','subtaskOn','metaOn','quality','speed','mistake','seeds','actionLayer','fast'])
    $(id).addEventListener('change', () => { if (['task','subtask','quality','speed','mistake','subtaskOn','metaOn'].includes(id)) $('lock').checked = true; schedulePredict(); });
  $('task').addEventListener('input', () => { $('lock').checked = true; });
  $('overlayOn').onchange = drawCams;
  $('head').onchange = () => { drawCams(); drawTokens(); };
  $('alpha').oninput = drawCams;
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight') setFrame(S.frame + S.meta.stride, true);
    if (e.key === 'ArrowLeft') setFrame(S.frame - S.meta.stride, true);
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
  window.addEventListener('resize', () => { drawBands(); drawJointCharts(); });
  await loadDataset(S.meta.datasets[0]);
}

function fillHeads() {
  const n = S.pred && S.pred.attention.action.prompt ? S.pred.attention.action.prompt.length : 8;
  const cur = $('head').value;
  fill($('head'), [[-1, 'mean'], ...[...Array(n).keys()].map(i => [i, 'h' + i])], cur === '' ? -1 : cur);
}

async function loadDataset(name) {
  S.ds = name; $('ds').value = name; setStatus('loading ' + name + ' …');
  const eps = await getJSON('/api/episodes?dataset=' + encodeURIComponent(name));
  fill($('ep'), eps.episodes.map(e => [e.index, `ep ${e.index} (${e.n_frames} f)`]));
  setStatus('');
  await loadEpisode(eps.episodes[0].index);
}

async function loadEpisode(ep) {
  S.ep = ep; $('ep').value = ep;
  S.epInfo = await getJSON(`/api/episode?dataset=${encodeURIComponent(S.ds)}&episode=${ep}`);
  $('slider').max = S.epInfo.n_frames - 1;
  drawBands();
  setFrame(0, true);
}

// ── frame ─────────────────────────────────────────────────────────────────
let frameTimer = null;
function setFrame(f, immediate) {
  const max = S.epInfo ? S.epInfo.n_frames - 1 : 0;
  f = Math.min(Math.max(f, 0), max); f -= f % S.meta.stride;
  S.frame = f; $('slider').value = f;
  $('frameLabel').textContent = `frame ${f} / ${max}  (${(f / S.meta.fps).toFixed(2)} s)`;
  drawBands();
  clearTimeout(frameTimer);
  frameTimer = setTimeout(fetchFrame, immediate ? 0 : 60);
}

async function fetchFrame() {
  const gen = ++S.gen;
  const f = S.frame;
  try {
    const fd = await getJSON(`/api/frame?dataset=${encodeURIComponent(S.ds)}&episode=${S.ep}&frame=${f}`);
    if (gen !== S.gen) return;
    S.fd = fd; S.pred = null;
    await loadCamImages(fd);
    if (gen !== S.gen) return;
    if (!$('lock').checked) applyDatasetPrompt();
    $('dsPrompt').textContent = `dataset: task "${fd.task}" · subtask "${fd.subtask || '(none)'}" · metadata ${fd.dataset_metadata ? JSON.stringify(fd.dataset_metadata) : '(none)'}`;
    $('state').textContent = fd.state ? fd.joint_names.map((n, i) => `${n}=${fd.state[i].toFixed(1)}`).join('  ') : '';
    drawCams(); drawTrace(); drawJointCharts(); drawTokens(); drawBudget();
    if ($('auto').checked) schedulePredict();
  } catch (e) { setStatus(e.message, true); }
}

function applyDatasetPrompt() {
  if (!S.fd) return;
  $('task').value = S.fd.task; $('subtask').value = S.fd.subtask || '';
  $('subtaskOn').checked = !!S.fd.subtask; $('metaOn').checked = true;
  setMeta(S.fd.dataset_metadata || S.fd.deployment_metadata);
  $('genOut').textContent = '';
}
function setMeta(m) { $('quality').value = m.quality; $('speed').value = m.speed; $('mistake').checked = !!m.mistake; }
function currentMeta() { return $('metaOn').checked ? { quality: parseInt($('quality').value), mistake: $('mistake').checked, speed: parseInt($('speed').value) } : null; }

function loadCamImages(fd) {
  const entries = Object.entries(fd.images); if (fd.depth) entries.push(['depth', fd.depth]);
  S.camImgs = {};
  return Promise.all(entries.map(([name, src]) => new Promise(res => { const im = new Image(); im.onload = () => { S.camImgs[name] = im; res(); }; im.onerror = res; im.src = src; })));
}

// ── predict ───────────────────────────────────────────────────────────────
let predTimer = null;
function schedulePredict() { S.dirty = true; clearTimeout(predTimer); predTimer = setTimeout(runPredict, 250); }
async function runPredict() {
  if (S.inflight || !S.fd) return;
  S.dirty = false; S.inflight = true;
  const gen = S.gen, t0 = performance.now();
  const body = { dataset: S.ds, episode: S.ep, frame: S.frame, task: $('task').value,
    subtask: $('subtaskOn').checked ? $('subtask').value : '', metadata: currentMeta(),
    seeds: parseInt($('seeds').value) || 1, action_layer: parseInt($('actionLayer').value), fast: $('fast').checked };
  $('predStatus').textContent = 'running …'; $('predStatus').className = 'status';
  try {
    const pred = await postJSON('/api/predict', body);
    if (gen === S.gen) { S.pred = pred;
      $('predStatus').textContent = `done in ${((performance.now() - t0) / 1000).toFixed(2)} s · ${body.seeds} seed(s)`;
      fillHeads(); drawCams(); drawTrace(); drawJointCharts(); drawTokens(); drawBudget(); }
  } catch (e) { $('predStatus').textContent = e.message; $('predStatus').className = 'status err'; }
  S.inflight = false;
  if (S.dirty) runPredict();
}

async function generateSubtask() {
  if (!S.fd) return;
  $('gen').disabled = true; $('genOut').textContent = '…';
  try {
    const r = await postJSON('/api/generate_subtask', { dataset: S.ds, episode: S.ep, frame: S.frame, task: $('task').value });
    const raw = r.raw.length > 90 ? r.raw.slice(0, 90) + '…' : r.raw;
    $('genOut').textContent = r.index >= 0 ? `→ "${r.name}" (raw: "${raw}")` : `→ off-vocab: "${raw}"`;
    $('genOut').title = 'generation prompt:\n' + r.prompt + '\n\nraw answer:\n' + r.raw;
    if (r.index >= 0) { $('subtask').value = r.name; $('subtaskOn').checked = true; $('lock').checked = true; schedulePredict(); }
  } catch (e) { $('genOut').textContent = e.message; }
  $('gen').disabled = false;
}

// ── play ──────────────────────────────────────────────────────────────────
let playTimer = null;
function togglePlay() {
  S.playing = !S.playing; $('play').textContent = S.playing ? 'pause' : 'play';
  clearInterval(playTimer);
  if (S.playing) playTimer = setInterval(() => { if (S.frame + S.meta.stride > S.epInfo.n_frames - 1) return togglePlay(); setFrame(S.frame + S.meta.stride, true); }, 1000 * S.meta.stride / S.meta.fps);
}

// ── timeline ──────────────────────────────────────────────────────────────
function drawBands() {
  const c = $('bands'); if (!S.epInfo) return;
  c.width = c.clientWidth * devicePixelRatio; c.height = 28 * devicePixelRatio;
  const g = c.getContext('2d'); g.scale(devicePixelRatio, devicePixelRatio);
  const W = c.clientWidth, n = S.epInfo.n_frames;
  g.fillStyle = '#1e2229'; g.fillRect(0, 0, W, 28);
  const palette = {}; let k = 0;
  for (const b of S.epInfo.subtasks) {
    if (!(b.label in palette)) palette[b.label] = SEED_COLORS[(k++) % SEED_COLORS.length];
    g.fillStyle = palette[b.label]; g.globalAlpha = 0.6;
    g.fillRect(b.start / n * W, 0, (b.end - b.start) / n * W, 19);
  }
  g.globalAlpha = 1;
  for (const b of S.epInfo.mistakes) { g.fillStyle = '#ff6b6b'; g.fillRect(b.start / n * W, 21, (b.end - b.start) / n * W, 7); }
  g.fillStyle = '#fff'; g.fillRect(S.frame / n * W - 1, 0, 2, 28);
  c.title = S.epInfo.subtasks.map(b => `${b.start}-${b.end}: ${b.label}`).join('\n');
}

// ── cameras + overlays ────────────────────────────────────────────────────
function overlayGrids() {
  if (!S.pred || !$('overlayOn').checked) return null;
  const head = parseInt($('head').value), A = S.pred.attention, out = {};
  const pick = item => item ? (head < 0 ? meanRows(item.heads) : item.heads[head]) : null;
  for (const [name, item] of Object.entries(A.action.cams)) out[name] = { grid_hw: item.grid_hw, values: pick(item) };
  if (A.action.depth) out.depth = { grid_hw: A.action.depth.grid_hw, values: pick(A.action.depth), null_bank: A.action.depth.null_bank };
  return out;
}
function meanRows(rows) { const n = rows.length, m = rows[0].length, out = new Array(m).fill(0); for (const r of rows) for (let i = 0; i < m; i++) out[i] += r[i] / n; return out; }

function drawCams() {
  const box = $('cams');
  const names = Object.keys(S.camImgs);
  if (box.children.length !== names.length || [...box.children].some((c, i) => c.dataset.name !== names[i])) {
    box.innerHTML = '';
    for (const name of names) { const d = document.createElement('div'); d.className = 'cam'; d.dataset.name = name;
      d.innerHTML = `<canvas></canvas><span class="name">${name.replace(/^img_/, '')}</span><span class="peak"></span>`; box.appendChild(d); }
  }
  const grids = overlayGrids(), alpha = parseFloat($('alpha').value);
  for (const d of box.children) {
    const name = d.dataset.name, im = S.camImgs[name], c = d.querySelector('canvas');
    const size = 448; c.width = size; c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, size, size);
    const s = Math.min(size / im.width, size / im.height), w = im.width * s, h = im.height * s, x = (size - w) / 2, y = (size - h) / 2;
    g.drawImage(im, x, y, w, h);
    const peak = d.querySelector('.peak'); peak.textContent = '';
    if (!grids || !grids[name] || !grids[name].values) continue;
    // Same rendering as probes.attention.cv2_overlay: JET over the panel's own max,
    // upsampled smoothly, blended at a constant weight over the whole image.
    const grid = grids[name], [rows, cols] = grid.grid_hw, vals = grid.values;
    let vmax = 0; for (const v of vals) vmax = Math.max(vmax, v);
    const off = document.createElement('canvas'); off.width = cols; off.height = rows;
    const id = off.getContext('2d').createImageData(cols, rows);
    for (let i = 0; i < rows * cols; i++) { const [r, gg, b] = jet(vmax > 0 ? vals[i] / vmax : 0); id.data[4*i] = r; id.data[4*i+1] = gg; id.data[4*i+2] = b; id.data[4*i+3] = 255; }
    off.getContext('2d').putImageData(id, 0, 0);
    // two-stage upscale: nearest to 4x then smooth, which reads like bicubic rather than blurry bilinear
    const mid = document.createElement('canvas'); mid.width = cols * 4; mid.height = rows * 4;
    const mg = mid.getContext('2d'); mg.imageSmoothingEnabled = false; mg.drawImage(off, 0, 0, mid.width, mid.height);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.globalAlpha = alpha;
    g.drawImage(mid, x, y, w, h); g.globalAlpha = 1;
    peak.textContent = (grid.null_bank ? 'null bank · ' : '') + 'max ' + vmax.toExponential(2);
  }
}

// ── action trace (plotly) ─────────────────────────────────────────────────
function cubeRange(points, tableZ) {
  let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (const p of points) for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], p[i]); hi[i] = Math.max(hi[i], p[i]); }
  lo[2] = Math.min(lo[2], tableZ); hi[2] = Math.max(hi[2], tableZ);
  const c = lo.map((v, i) => (v + hi[i]) / 2), half = Math.max(...hi.map((v, i) => v - lo[i])) / 2 * 1.05 + 0.005;
  return c.map(v => [v - half, v + half]);
}
function hover3d(name, chunk) {
  return chunk.map((r, i) => `<b>${name}</b><br>step ${i} · ${(i / S.meta.fps * 1000).toFixed(0)} ms<br>wrist roll ${r[5].toFixed(1)}° · gripper ${r[6].toFixed(1)}°`);
}
function drawTrace() {
  const scene = $('scene'); if (!S.fd) return;
  const P = S.pred, ee = P ? P.ee : null;
  if (!ee) { Plotly.purge(scene); scene.innerHTML = '<div class="small" style="padding:20px">predict to draw the trace</div>'; Plotly.purge($('wristPanel')); Plotly.purge($('gripPanel')); return; }
  const traces = [];
  const pts = [...ee.gt, ...ee.seeds.flat()]; if (ee.fast) pts.push(...ee.fast); if (ee.start) pts.push(ee.start);
  const rng = cubeRange(pts, ee.table_z);
  traces.push({ type: 'mesh3d', x: [rng[0][0], rng[0][1], rng[0][1], rng[0][0]], y: [rng[1][0], rng[1][0], rng[1][1], rng[1][1]], z: Array(4).fill(ee.table_z),
    i: [0, 0], j: [1, 2], k: [2, 3], color: '#4f9cff', opacity: 0.08, hoverinfo: 'skip', name: 'table plane', showlegend: false });
  const line3 = (xyz, chunk, name, color, width, dash, opacity) => ({ type: 'scatter3d', mode: 'lines+markers', x: xyz.map(p => p[0]), y: xyz.map(p => p[1]), z: xyz.map(p => p[2]),
    line: { color, width, dash }, marker: { size: 2.5, color }, opacity, name, text: hover3d(name, chunk), hovertemplate: '%{text}<br>x %{x:.3f} · y %{y:.3f} · z %{z:.3f} m<extra></extra>' });
  if (ee.start) {
    traces.push({ type: 'scatter3d', mode: 'markers', x: [ee.start[0]], y: [ee.start[1]], z: [ee.start[2]], marker: { size: 6, color: NOW_COLOR, symbol: 'diamond' }, name: 'measured now', hovertemplate: 'measured pose now<extra></extra>' });
    traces.push({ type: 'scatter3d', mode: 'lines', x: [ee.start[0], ee.gt[0][0]], y: [ee.start[1], ee.gt[0][1]], z: [ee.start[2], ee.gt[0][2]], line: { color: NOW_COLOR, width: 5, dash: 'dash' }, name: 'GT initial gap', hoverinfo: 'skip' });
  }
  traces.push(line3(ee.gt, S.fd.gt, 'ground truth', GT_COLOR, 7, 'solid', 1));
  ee.seeds.forEach((xyz, k) => {
    if (ee.start) traces.push({ type: 'scatter3d', mode: 'lines', x: [ee.start[0], xyz[0][0]], y: [ee.start[1], xyz[0][1]], z: [ee.start[2], xyz[0][2]], line: { color: SEED_COLORS[k % 16], width: 3, dash: 'dot' }, showlegend: false, hoverinfo: 'skip' });
    traces.push(line3(xyz, P.chunks[k], `seed ${k}`, SEED_COLORS[k % 16], 5, 'solid', 0.95));
  });
  if (ee.fast) traces.push(line3(ee.fast, P.fast, 'FAST decode', FAST_COLOR, 5, 'dash', 0.95));
  const axis = t => ({ title: { text: t }, range: null, gridcolor: '#2a2f38', zerolinecolor: '#2a2f38', backgroundcolor: 'rgba(0,0,0,0)', color: '#8b93a1', tickformat: '.2f' });
  const layout = { paper_bgcolor: 'rgba(0,0,0,0)', font: PLOT_FONT, margin: { l: 0, r: 0, t: 6, b: 0 }, uirevision: 'keep',
    legend: { orientation: 'h', y: 0, x: 0, bgcolor: 'rgba(0,0,0,0)' },
    scene: { aspectmode: 'cube', xaxis: { ...axis('x [m]'), range: rng[0] }, yaxis: { ...axis('y [m]'), range: rng[1] }, zaxis: { ...axis('z [m]'), range: rng[2] }, bgcolor: 'rgba(0,0,0,0)', camera: undefined } };
  Plotly.react(scene, traces, layout, { responsive: true, displaylogo: false, modeBarButtonsToRemove: ['toImage'] });
  drawPanel($('wristPanel'), 5, 'wrist roll');
  drawPanel($('gripPanel'), 6, 'gripper');
  $('chartLegend').innerHTML = `<span><i style="background:${GT_COLOR}"></i>ground truth (raw demo)</span><span><i style="background:${NOW_COLOR}"></i>measured now + initial gap</span><span><i style="background:${SEED_COLORS[0]}"></i>flow chunk per seed (filtered command)</span>` + (ee.fast ? `<span><i style="background:${FAST_COLOR}"></i>FAST decode</span>` : '');
  $('chunkNote').textContent = `${ee.seeds.length} seed(s) · ${S.fd.gt.length} steps · end-effector via reBot FK`;
}
function drawPanel(div, j, label) {
  const P = S.pred, steps = S.fd.gt.map((_, i) => i);
  const traces = [];
  if (S.fd.state) traces.push({ x: [-1], y: [S.fd.state[j]], mode: 'markers', marker: { color: NOW_COLOR, size: 9, symbol: 'diamond' }, name: 'measured now', hovertemplate: `measured ${label} now: %{y:.1f}°<extra></extra>` },
    { x: [-1, 0], y: [S.fd.state[j], S.fd.gt[0][j]], mode: 'lines', line: { color: NOW_COLOR, width: 3, dash: 'dash' }, hoverinfo: 'skip', showlegend: false });
  traces.push({ x: steps, y: S.fd.gt.map(r => r[j]), mode: 'lines+markers', line: { color: GT_COLOR, width: 3 }, marker: { size: 3 }, name: 'ground truth', hovertemplate: `GT ${label}<br>step %{x}: %{y:.1f}°<extra></extra>` });
  P.chunks.forEach((ch, k) => traces.push({ x: steps, y: ch.map(r => r[j]), mode: 'lines', line: { color: SEED_COLORS[k % 16], width: 2 }, name: `seed ${k}`, hovertemplate: `seed ${k} ${label}<br>step %{x}: %{y:.1f}°<extra></extra>` }));
  if (P.fast) traces.push({ x: steps, y: P.fast.map(r => r[j]), mode: 'lines', line: { color: FAST_COLOR, width: 2, dash: 'dash' }, name: 'FAST', hovertemplate: `FAST ${label}<br>step %{x}: %{y:.1f}°<extra></extra>` });
  const layout = { title: { text: label + ' [deg]', font: { size: 11, color: '#8b93a1' }, x: 0.02, y: 0.97 }, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: '#1e2229', font: PLOT_FONT,
    margin: { l: 42, r: 8, t: 22, b: 26 }, showlegend: false, uirevision: 'keep',
    xaxis: { title: { text: 'step' }, gridcolor: '#2a2f38', zeroline: false, color: '#8b93a1' }, yaxis: { gridcolor: '#2a2f38', zeroline: false, color: '#8b93a1' } };
  Plotly.react(div, traces, layout, { responsive: true, displayModeBar: false });
}

// ── per-joint small multiples (collapsed) ─────────────────────────────────
function drawJointCharts() {
  const box = $('charts'); if (!S.fd) return;
  const names = S.fd.joint_names, gt = S.fd.gt, chunks = S.pred ? S.pred.chunks : [], fast = S.pred ? S.pred.fast : null;
  if (box.children.length !== names.length) { box.innerHTML = ''; for (const n of names) { const d = document.createElement('div'); d.className = 'chart'; d.innerHTML = `<div class="t">${n}</div><canvas></canvas>`; box.appendChild(d); } }
  names.forEach((n, j) => {
    const c = box.children[j].querySelector('canvas'); const W = c.clientWidth || 170, H = 110;
    c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
    const g = c.getContext('2d'); g.scale(devicePixelRatio, devicePixelRatio);
    g.fillStyle = '#1e2229'; g.fillRect(0, 0, W, H);
    const series = [gt.map(r => r[j]), ...chunks.map(ch => ch.map(r => r[j]))]; if (fast) series.push(fast.map(r => r[j]));
    let lo = Infinity, hi = -Infinity; for (const s of series) for (const v of s) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    if (S.fd.state) { lo = Math.min(lo, S.fd.state[j]); hi = Math.max(hi, S.fd.state[j]); }
    const pad = Math.max((hi - lo) * 0.1, 0.5); lo -= pad; hi += pad;
    const T = gt.length, X = i => 8 + i / (T - 1) * (W - 16), Y = v => H - 6 - (v - lo) / (hi - lo) * (H - 12);
    const line = (s, color, dash, width) => { g.strokeStyle = color; g.lineWidth = width; g.setLineDash(dash); g.beginPath(); s.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke(); g.setLineDash([]); };
    if (S.fd.state) { g.strokeStyle = NOW_COLOR; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(8, Y(S.fd.state[j])); g.lineTo(W - 8, Y(S.fd.state[j])); g.stroke(); g.setLineDash([]); }
    chunks.forEach((ch, k) => line(ch.map(r => r[j]), SEED_COLORS[k % 16], [], 1.5));
    if (fast) line(fast.map(r => r[j]), FAST_COLOR, [4, 3], 1.5);
    line(series[0], GT_COLOR, [], 1.6);
    g.fillStyle = '#8b93a1'; g.font = '10px ui-monospace, monospace'; g.fillText(hi.toFixed(0), 2, 10); g.fillText(lo.toFixed(0), 2, H - 2);
  });
}

// ── tokens ────────────────────────────────────────────────────────────────
function drawTokens() {
  const box = $('tokens'); if (!S.pred) { box.innerHTML = '<span class="small">predict to see the prompt the model actually read</span>'; $('tokNote').textContent = ''; return; }
  const A = S.pred.attention, head = parseInt($('head').value);
  let mass = null;
  if (A.action.prompt) mass = head < 0 ? meanRows(A.action.prompt) : A.action.prompt[head];
  const vmax = mass ? Math.max(...mass) : 1;
  box.innerHTML = '';
  A.tokens.forEach((t, i) => {
    const s = document.createElement('span'); s.className = 'tok'; s.textContent = t.label || '·';
    if (mass) { const v = mass[i] / vmax; const [r, g, b] = jet(v); s.style.background = `rgba(${r|0},${g|0},${b|0},${(0.12 + 0.75 * v).toFixed(2)})`; s.title = `${(100 * mass[i]).toFixed(2)}% of the action queries' mass`; }
    box.appendChild(s);
  });
  $('tokNote').textContent = mass ? `colour = action expert L${A.action.layer} mass on each token (${head < 0 ? 'mean over heads' : 'head ' + head})` : '';
}

// ── budget ────────────────────────────────────────────────────────────────
function drawBudget() {
  const box = $('budget'); box.innerHTML = ''; if (!S.pred) { $('budgetNote').textContent = ''; $('budgetLegend').innerHTML = ''; return; }
  const A = S.pred.attention;
  $('budgetLegend').innerHTML = Object.entries(GROUP_COLORS).map(([k, c]) => `<span><i style="background:${c}"></i>${k.replace(/^img_/, '')}</span>`).join('');
  const bar = (label, parts) => { const row = document.createElement('div'); row.innerHTML = `<div>${label}</div>`; const b = document.createElement('div'); b.className = 'bar';
    for (const [k, v] of parts) { const s = document.createElement('span'); s.style.width = (100 * v).toFixed(2) + '%'; s.style.background = GROUP_COLORS[k] || '#888'; s.title = `${k}: ${(100 * v).toFixed(1)}%`; b.appendChild(s); }
    row.appendChild(b); box.appendChild(row); };
  if (A.action.budget) {
    const H = A.action.budget.other.length;
    $('budgetNote').textContent = `action expert L${A.action.layer}, per head, mean over the ${S.meta.chunk_size} action queries`;
    for (let h = 0; h < H; h++) bar('h' + h, Object.entries(A.action.budget).map(([k, v]) => [k, v[h]]));
  }
}

init().catch(e => setStatus(e.message, true));
</script>
