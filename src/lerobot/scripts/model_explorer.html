<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model explorer</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#d7dae0; --dim:#8a919c; --acc:#5aa9ff; --warn:#ffb454; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  header .ckpt { color:var(--dim); font-family:ui-monospace, monospace; font-size:12px; }
  main { display:grid; grid-template-columns: minmax(0, 1.5fr) minmax(360px, 1fr); gap:12px; padding:12px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px; }
  section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; }
  label { color:var(--dim); }
  select, input[type=text], input[type=number], textarea, button { background:#0f1114; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 6px; font:inherit; }
  textarea { width:100%; resize:vertical; }
  button { cursor:pointer; }
  button.primary { background:var(--acc); color:#000; border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0; }
  .row > label { min-width:70px; }
  .cams { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:8px; }
  .cam { position:relative; }
  .cam canvas { width:100%; aspect-ratio:1; background:#000; border-radius:4px; display:block; }
  .cam .name { position:absolute; left:6px; top:4px; font-size:11px; color:#fff; text-shadow:0 0 3px #000; }
  .cam .peak { position:absolute; right:6px; top:4px; font-size:11px; color:#fff; text-shadow:0 0 3px #000; font-family:ui-monospace, monospace; }
  .timeline { margin-top:10px; }
  .timeline canvas { width:100%; height:26px; display:block; border-radius:3px; }
  input[type=range] { width:100%; }
  .charts { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:8px; }
  .chart canvas { width:100%; height:120px; display:block; background:#0f1114; border-radius:4px; }
  .chart .t { font-size:11px; color:var(--dim); margin-bottom:2px; }
  .tokens { line-height:1.9; font-family:ui-monospace, monospace; font-size:12px; }
  .tok { display:inline-block; padding:0 3px; margin:1px 1px; border-radius:3px; cursor:pointer; border:1px solid transparent; white-space:pre; }
  .tok.sel { border-color:var(--warn); }
  .budget { font-family:ui-monospace, monospace; font-size:11px; }
  .bar { display:flex; height:12px; margin:2px 0; background:#0f1114; border-radius:2px; overflow:hidden; }
  .bar span { display:block; height:100%; }
  .legend span { display:inline-block; margin-right:10px; }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; border-radius:2px; }
  .status { color:var(--dim); font-size:12px; min-height:1.4em; }
  .status.err { color:#ff6b6b; }
  .kv { font-family:ui-monospace, monospace; font-size:11px; color:var(--dim); }
  .small { font-size:11px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Model explorer</h1>
  <span class="ckpt" id="ckpt"></span>
  <label>dataset <select id="ds"></select></label>
  <label>episode <select id="ep"></select></label>
  <span class="status" id="status"></span>
</header>
<main>
  <div style="display:flex; flex-direction:column; gap:12px; min-width:0">
    <section>
      <div class="cams" id="cams"></div>
      <div class="timeline">
        <canvas id="bands"></canvas>
        <input type="range" id="slider" min="0" max="0" step="1" value="0">
        <div class="row">
          <button id="play">play</button>
          <span class="kv" id="frameLabel"></span>
          <span class="small">arrows step one stride; space plays</span>
          <span style="flex:1"></span>
          <label>overlay
            <select id="overlay">
              <option value="none">none</option>
              <option value="action" selected>action expert → prefix</option>
              <option value="vlm">VLM token → prefix</option>
            </select>
          </label>
          <label>head <select id="head"></select></label>
          <label>alpha <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.7" style="width:80px"></label>
        </div>
      </div>
    </section>
    <section>
      <h2>Action chunk <span class="small" id="chunkNote"></span></h2>
      <div class="charts" id="charts"></div>
      <div class="legend small" style="margin-top:6px" id="chartLegend"></div>
    </section>
    <section>
      <h2>Prompt tokens <span class="small" id="tokNote"></span></h2>
      <div class="tokens" id="tokens"></div>
    </section>
  </div>
  <div style="display:flex; flex-direction:column; gap:12px; min-width:0">
    <section>
      <h2>Prompt</h2>
      <div class="row"><label>task</label><textarea id="task" rows="2"></textarea></div>
      <div class="row"><label>subtask</label><input type="text" id="subtask" list="vocab" style="flex:1"><datalist id="vocab"></datalist></div>
      <div class="row"><label></label><label><input type="checkbox" id="subtaskOn" checked> subtask clause</label>
        <button id="gen">generate subtask</button><span class="kv" id="genOut"></span></div>
      <div class="row"><label>metadata</label>
        <label><input type="checkbox" id="metaOn" checked> clause</label>
        <label>quality <select id="quality"></select></label>
        <label>speed <select id="speed"></select></label>
        <label><input type="checkbox" id="mistake"> mistake</label>
        <button id="metaDeploy" title="quality 5, no mistake, speed 5">deployment</button>
        <button id="metaDataset" title="the labels this frame trained with">dataset</button>
      </div>
      <div class="row"><label></label>
        <label><input type="checkbox" id="lock"> keep my edits while scrubbing</label>
        <button id="reset">reset to dataset</button></div>
      <div class="kv" id="dsPrompt"></div>
    </section>
    <section>
      <h2>Forward</h2>
      <div class="row">
        <label>seeds</label><input type="number" id="seeds" min="1" max="16" value="1" style="width:60px">
        <label>action layer</label><select id="actionLayer"></select>
        <label>VLM layer</label><select id="vlmLayer"></select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="fast"> FAST decode</label>
        <label><input type="checkbox" id="auto" checked> predict on scrub</label>
        <span style="flex:1"></span>
        <button class="primary" id="predict">predict</button>
      </div>
      <div class="status" id="predStatus"></div>
    </section>
    <section>
      <h2>Attention budget <span class="small" id="budgetNote"></span></h2>
      <div class="legend small" id="budgetLegend"></div>
      <div class="budget" id="budget"></div>
    </section>
    <section>
      <h2>State</h2>
      <div class="kv" id="state"></div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const S = { meta:null, ds:null, ep:null, epInfo:null, frame:0, fd:null, pred:null, token:null, playing:false, gen:0,
            inflight:false, dirty:false, camImgs:{} };
const SEED_COLORS = ['#5aa9ff','#ff7b72','#7ee787','#d2a8ff','#ffa657','#79c0ff','#f778ba','#a5d6ff','#e3b341','#56d364','#ff9bce','#8ddb8c','#c297ff','#ffdf5d','#6cb6ff','#ffab70'];
const GROUP_COLORS = { img_external_0:'#5aa9ff', img_external_1:'#3d7bd9', img_wrist_0:'#7ee787', depth:'#ffa657', prompt:'#d2a8ff', other:'#555b66' };

function setStatus(msg, err) { const e = $('status'); e.textContent = msg || ''; e.className = 'status' + (err ? ' err' : ''); }
async function getJSON(url) { const r = await fetch(url); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }
async function postJSON(url, body) { const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)}); const j = await r.json(); if (j.error) throw new Error(j.error); return j; }
function fill(sel, items, value) { sel.innerHTML = ''; for (const [v, t] of items) { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); } if (value !== undefined) sel.value = value; }

// ── colormap (turbo-ish, 5 stops) ─────────────────────────────────────────
const STOPS = [[48,18,59],[65,150,240],[122,229,116],[249,190,30],[178,30,10]];
function cmap(t) { t = Math.min(Math.max(t, 0), 1) * (STOPS.length - 1); const i = Math.min(Math.floor(t), STOPS.length - 2), f = t - i;
  const a = STOPS[i], b = STOPS[i + 1]; return [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f, a[2] + (b[2]-a[2])*f]; }

// ── init ──────────────────────────────────────────────────────────────────
async function init() {
  S.meta = await getJSON('/api/meta');
  $('ckpt').textContent = S.meta.checkpoint;
  fill($('ds'), S.meta.datasets.map(d => [d, d]));
  fill($('actionLayer'), [...Array(S.meta.n_action_layers).keys()].map(i => [i, i]), 9);
  fill($('vlmLayer'), [...Array(S.meta.n_vlm_layers).keys()].map(i => [i, i]), 9);
  fill($('quality'), [1,2,3,4,5].map(i => [i, i]), 5);
  fill($('speed'), [1,2,3,4,5].map(i => [i, i]), 5);
  $('vocab').innerHTML = S.meta.subtask_vocab.map(v => `<option value="${v.replace(/"/g,'&quot;')}">`).join('');
  fillHeads();
  $('slider').step = S.meta.stride;
  $('ds').onchange = () => loadDataset($('ds').value);
  $('ep').onchange = () => loadEpisode(parseInt($('ep').value));
  $('slider').oninput = () => setFrame(parseInt($('slider').value));
  $('play').onclick = togglePlay;
  $('predict').onclick = () => { S.dirty = true; runPredict(); };
  $('gen').onclick = generateSubtask;
  $('reset').onclick = () => { $('lock').checked = false; applyDatasetPrompt(); schedulePredict(); };
  $('metaDeploy').onclick = () => { setMeta(S.meta.deployment_metadata); schedulePredict(); };
  $('metaDataset').onclick = () => { if (S.fd && S.fd.dataset_metadata) { setMeta(S.fd.dataset_metadata); schedulePredict(); } };
  for (const id of ['task','subtask','subtaskOn','metaOn','quality','speed','mistake','seeds','actionLayer','vlmLayer','fast'])
    $(id).addEventListener('change', () => { if (['task','subtask','quality','speed','mistake','subtaskOn','metaOn'].includes(id)) $('lock').checked = true; schedulePredict(); });
  $('task').addEventListener('input', () => { $('lock').checked = true; });
  $('overlay').onchange = () => { fillHeads(); drawCams(); drawTokens(); drawBudget(); };
  $('head').onchange = () => { if ($('overlay').value === 'vlm') { S.dirty = true; runPredict(); } else { drawCams(); drawTokens(); drawBudget(); } };
  $('alpha').oninput = drawCams;
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') setFrame(S.frame + S.meta.stride, true);
    if (e.key === 'ArrowLeft') setFrame(S.frame - S.meta.stride, true);
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
  await loadDataset(S.meta.datasets[0]);
}

function fillHeads() {
  const mode = $('overlay').value;
  const n = mode === 'vlm' ? (S.pred ? S.pred.attention.vlm.n_heads : 32) : (S.pred && S.pred.attention.action.prompt ? S.pred.attention.action.prompt.length : 8);
  const cur = $('head').value;
  fill($('head'), [[-1, 'mean'], ...[...Array(n).keys()].map(i => [i, 'h' + i])], cur === '' ? -1 : cur);
}

async function loadDataset(name) {
  S.ds = name; $('ds').value = name; setStatus('loading ' + name + ' …');
  const eps = await getJSON('/api/episodes?dataset=' + encodeURIComponent(name));
  fill($('ep'), eps.episodes.map(e => [e.index, `ep ${e.index} (${e.n_frames} f)`]));
  setStatus('');
  await loadEpisode(eps.episodes[0].index);
}

async function loadEpisode(ep) {
  S.ep = ep; $('ep').value = ep;
  S.epInfo = await getJSON(`/api/episode?dataset=${encodeURIComponent(S.ds)}&episode=${ep}`);
  $('slider').max = S.epInfo.n_frames - 1;
  drawBands();
  setFrame(0, true);
}

// ── frame ─────────────────────────────────────────────────────────────────
let frameTimer = null;
function setFrame(f, immediate) {
  const max = S.epInfo ? S.epInfo.n_frames - 1 : 0;
  f = Math.min(Math.max(f, 0), max); f -= f % S.meta.stride;
  S.frame = f; $('slider').value = f;
  $('frameLabel').textContent = `frame ${f} / ${max}  (${(f / S.meta.fps).toFixed(2)} s)`;
  drawBands();
  clearTimeout(frameTimer);
  frameTimer = setTimeout(fetchFrame, immediate ? 0 : 60);
}

async function fetchFrame() {
  const gen = ++S.gen;
  const f = S.frame;
  try {
    const fd = await getJSON(`/api/frame?dataset=${encodeURIComponent(S.ds)}&episode=${S.ep}&frame=${f}`);
    if (gen !== S.gen) return;
    S.fd = fd; S.pred = null; S.token = null;
    await loadCamImages(fd);
    if (gen !== S.gen) return;
    if (!$('lock').checked) applyDatasetPrompt();
    $('dsPrompt').textContent = `dataset: task "${fd.task}" · subtask "${fd.subtask || '(none)'}" · metadata ${fd.dataset_metadata ? JSON.stringify(fd.dataset_metadata) : '(none)'}`;
    $('state').textContent = fd.state ? fd.joint_names.map((n, i) => `${n}=${fd.state[i].toFixed(1)}`).join('  ') : '';
    drawCams(); drawCharts(); drawTokens(); drawBudget();
    if ($('auto').checked) schedulePredict();
  } catch (e) { setStatus(e.message, true); }
}

function applyDatasetPrompt() {
  if (!S.fd) return;
  $('task').value = S.fd.task; $('subtask').value = S.fd.subtask || '';
  $('subtaskOn').checked = !!S.fd.subtask; $('metaOn').checked = true;
  setMeta(S.fd.dataset_metadata || S.fd.deployment_metadata);
  $('genOut').textContent = '';
}
function setMeta(m) { $('quality').value = m.quality; $('speed').value = m.speed; $('mistake').checked = !!m.mistake; }
function currentMeta() { return $('metaOn').checked ? { quality: parseInt($('quality').value), mistake: $('mistake').checked, speed: parseInt($('speed').value) } : null; }

function loadCamImages(fd) {
  const entries = Object.entries(fd.images); if (fd.depth) entries.push(['depth', fd.depth]);
  S.camImgs = {};
  return Promise.all(entries.map(([name, src]) => new Promise(res => { const im = new Image(); im.onload = () => { S.camImgs[name] = im; res(); }; im.onerror = res; im.src = src; })));
}

// ── predict ───────────────────────────────────────────────────────────────
let predTimer = null;
function schedulePredict() { S.dirty = true; clearTimeout(predTimer); predTimer = setTimeout(runPredict, 250); }
async function runPredict() {
  if (S.inflight || !S.fd) return;
  S.dirty = false; S.inflight = true;
  const gen = S.gen, t0 = performance.now();
  const body = { dataset: S.ds, episode: S.ep, frame: S.frame, task: $('task').value,
    subtask: $('subtaskOn').checked ? $('subtask').value : '', metadata: currentMeta(),
    seeds: parseInt($('seeds').value) || 1, action_layer: parseInt($('actionLayer').value), vlm_layer: parseInt($('vlmLayer').value),
    vlm_head: $('overlay').value === 'vlm' ? parseInt($('head').value) : -1, fast: $('fast').checked };
  $('predStatus').textContent = 'running …'; $('predStatus').className = 'status';
  try {
    const pred = await postJSON('/api/predict', body);
    if (gen === S.gen) { S.pred = pred; if (S.token === null && pred.attention.tokens.length) S.token = null;
      $('predStatus').textContent = `done in ${((performance.now() - t0) / 1000).toFixed(2)} s · ${body.seeds} seed(s)`;
      fillHeads(); drawCams(); drawCharts(); drawTokens(); drawBudget(); }
  } catch (e) { $('predStatus').textContent = e.message; $('predStatus').className = 'status err'; }
  S.inflight = false;
  if (S.dirty) runPredict();
}

async function generateSubtask() {
  if (!S.fd) return;
  $('gen').disabled = true; $('genOut').textContent = '…';
  try {
    const r = await postJSON('/api/generate_subtask', { dataset: S.ds, episode: S.ep, frame: S.frame, task: $('task').value });
    const raw = r.raw.length > 90 ? r.raw.slice(0, 90) + '…' : r.raw;
    $('genOut').textContent = r.index >= 0 ? `→ "${r.name}" (raw: "${raw}")` : `→ off-vocab: "${raw}"`;
    $('genOut').title = 'generation prompt:\n' + r.prompt + '\n\nraw answer:\n' + r.raw;
    $('subtask').value = r.name; $('subtaskOn').checked = true; $('lock').checked = true; schedulePredict();
  } catch (e) { $('genOut').textContent = e.message; }
  $('gen').disabled = false;
}

// ── play ──────────────────────────────────────────────────────────────────
let playTimer = null;
function togglePlay() {
  S.playing = !S.playing; $('play').textContent = S.playing ? 'pause' : 'play';
  clearInterval(playTimer);
  if (S.playing) playTimer = setInterval(() => { if (S.frame + S.meta.stride > S.epInfo.n_frames - 1) return togglePlay(); setFrame(S.frame + S.meta.stride, true); }, 1000 * S.meta.stride / S.meta.fps);
}

// ── drawing: timeline ─────────────────────────────────────────────────────
function drawBands() {
  const c = $('bands'); if (!S.epInfo) return;
  c.width = c.clientWidth * devicePixelRatio; c.height = 26 * devicePixelRatio;
  const g = c.getContext('2d'); g.scale(devicePixelRatio, devicePixelRatio);
  const W = c.clientWidth, n = S.epInfo.n_frames;
  g.fillStyle = '#0f1114'; g.fillRect(0, 0, W, 26);
  const palette = {};
  let k = 0;
  for (const b of S.epInfo.subtasks) {
    if (!(b.label in palette)) palette[b.label] = SEED_COLORS[(k++) % SEED_COLORS.length];
    g.fillStyle = palette[b.label]; g.globalAlpha = 0.55;
    g.fillRect(b.start / n * W, 0, (b.end - b.start) / n * W, 18);
  }
  g.globalAlpha = 1;
  for (const b of S.epInfo.mistakes) { g.fillStyle = '#ff6b6b'; g.fillRect(b.start / n * W, 19, (b.end - b.start) / n * W, 7); }
  g.fillStyle = '#fff'; g.fillRect(S.frame / n * W - 1, 0, 2, 26);
  c.title = S.epInfo.subtasks.map(b => `${b.start}-${b.end}: ${b.label}`).join('\n');
}

// ── drawing: cameras + overlays ───────────────────────────────────────────
function overlayGrids() {
  // -> { name: {grid_hw, values[]} } for the current overlay mode/head/token, plus a shared vmax
  if (!S.pred) return null;
  const mode = $('overlay').value, head = parseInt($('head').value), A = S.pred.attention;
  const out = {};
  if (mode === 'action') {
    const pick = item => item ? (head < 0 ? meanRows(item.heads) : item.heads[head]) : null;
    for (const [name, item] of Object.entries(A.action.cams)) out[name] = { grid_hw: item.grid_hw, values: pick(item) };
    if (A.action.depth) out.depth = { grid_hw: A.action.depth.grid_hw, values: pick(A.action.depth), null_bank: A.action.depth.null_bank };
  } else if (mode === 'vlm') {
    if (S.token === null) return null;
    for (const [name, item] of Object.entries(A.vlm.cams)) out[name] = { grid_hw: item.grid_hw, values: item.tokens[S.token] };
    if (A.vlm.depth) out.depth = { grid_hw: A.vlm.depth.grid_hw, values: A.vlm.depth.tokens[S.token], null_bank: A.vlm.depth.null_bank };
  } else return null;
  let vmax = 0; for (const g of Object.values(out)) if (g.values) for (const v of g.values) vmax = Math.max(vmax, v);
  return { grids: out, vmax };
}
function meanRows(rows) { const n = rows.length, m = rows[0].length, out = new Array(m).fill(0); for (const r of rows) for (let i = 0; i < m; i++) out[i] += r[i] / n; return out; }

function drawCams() {
  const box = $('cams');
  const names = Object.keys(S.camImgs);
  if (box.children.length !== names.length || [...box.children].some((c, i) => c.dataset.name !== names[i])) {
    box.innerHTML = '';
    for (const name of names) { const d = document.createElement('div'); d.className = 'cam'; d.dataset.name = name;
      d.innerHTML = `<canvas></canvas><span class="name">${name.replace(/^img_/, '')}</span><span class="peak"></span>`; box.appendChild(d); }
  }
  const ov = overlayGrids(), alpha = parseFloat($('alpha').value);
  for (const d of box.children) {
    const name = d.dataset.name, im = S.camImgs[name], c = d.querySelector('canvas');
    const size = 336; c.width = size; c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, size, size);
    // draw the image letterboxed into the square
    const s = Math.min(size / im.width, size / im.height), w = im.width * s, h = im.height * s, x = (size - w) / 2, y = (size - h) / 2;
    g.drawImage(im, x, y, w, h);
    const peak = d.querySelector('.peak'); peak.textContent = '';
    if (!ov || !ov.grids[name] || !ov.grids[name].values) continue;
    const grid = ov.grids[name], [rows, cols] = grid.grid_hw, vals = grid.values;
    const off = document.createElement('canvas'); off.width = cols; off.height = rows;
    const id = off.getContext('2d').createImageData(cols, rows);
    let localMax = 0;
    for (let i = 0; i < rows * cols; i++) { const t = ov.vmax > 0 ? vals[i] / ov.vmax : 0; localMax = Math.max(localMax, vals[i]);
      const [r, gg, b] = cmap(t); id.data[4*i] = r; id.data[4*i+1] = gg; id.data[4*i+2] = b; id.data[4*i+3] = Math.round(255 * alpha * Math.min(1, t * 1.25)); }
    off.getContext('2d').putImageData(id, 0, 0);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(off, x, y, w, h);
    peak.textContent = (grid.null_bank ? 'null bank · ' : '') + 'max ' + localMax.toExponential(2);
  }
}

// ── drawing: charts ───────────────────────────────────────────────────────
function drawCharts() {
  const box = $('charts'); if (!S.fd) return;
  const names = S.fd.joint_names, gt = S.fd.gt, chunks = S.pred ? S.pred.chunks : [], fast = S.pred ? S.pred.fast : null;
  if (box.children.length !== names.length) { box.innerHTML = ''; for (const n of names) { const d = document.createElement('div'); d.className = 'chart'; d.innerHTML = `<div class="t">${n}</div><canvas></canvas>`; box.appendChild(d); } }
  names.forEach((n, j) => {
    const c = box.children[j].querySelector('canvas'); const W = c.clientWidth || 170, H = 120;
    c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
    const g = c.getContext('2d'); g.scale(devicePixelRatio, devicePixelRatio);
    g.fillStyle = '#0f1114'; g.fillRect(0, 0, W, H);
    const series = [gt.map(r => r[j]), ...chunks.map(ch => ch.map(r => r[j]))]; if (fast) series.push(fast.map(r => r[j]));
    let lo = Infinity, hi = -Infinity; for (const s of series) for (const v of s) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    if (S.fd.state) { lo = Math.min(lo, S.fd.state[j]); hi = Math.max(hi, S.fd.state[j]); }
    const pad = Math.max((hi - lo) * 0.1, 0.5); lo -= pad; hi += pad;
    const T = gt.length, X = i => 8 + i / (T - 1) * (W - 16), Y = v => H - 6 - (v - lo) / (hi - lo) * (H - 12);
    const line = (s, color, dash, width) => { g.strokeStyle = color; g.lineWidth = width; g.setLineDash(dash); g.beginPath(); s.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke(); g.setLineDash([]); };
    if (S.fd.state) { g.strokeStyle = '#444'; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(8, Y(S.fd.state[j])); g.lineTo(W - 8, Y(S.fd.state[j])); g.stroke(); g.setLineDash([]); }
    chunks.forEach((ch, k) => line(ch.map(r => r[j]), SEED_COLORS[k % SEED_COLORS.length], [], 1.5));
    if (fast) line(fast.map(r => r[j]), '#bbb', [1, 2], 1.5);
    line(series[0], '#fff', [5, 3], 1.2);
    g.fillStyle = '#8a919c'; g.font = '10px ui-monospace, monospace'; g.fillText(hi.toFixed(0), 2, 10); g.fillText(lo.toFixed(0), 2, H - 2);
  });
  $('chartLegend').innerHTML = `<span><i style="background:#fff"></i>dataset future (dashed)</span><span><i style="background:#444"></i>current state (dotted)</span>` +
    (chunks.length ? `<span><i style="background:${SEED_COLORS[0]}"></i>flow chunk per seed</span>` : '') + (fast ? `<span><i style="background:#bbb"></i>FAST decode</span>` : '');
  $('chunkNote').textContent = S.pred ? `${chunks.length} seed(s) · ${gt.length} steps · raw joint units` : '(no prediction yet)';
}

// ── drawing: tokens ───────────────────────────────────────────────────────
function drawTokens() {
  const box = $('tokens'); if (!S.pred) { box.innerHTML = '<span class="small">predict to see the prompt the model actually read</span>'; return; }
  const A = S.pred.attention, mode = $('overlay').value, head = parseInt($('head').value);
  let mass = null;
  if (A.action.prompt) mass = head < 0 || mode === 'vlm' ? meanRows(A.action.prompt) : A.action.prompt[head];
  const vmax = mass ? Math.max(...mass) : 1;
  box.innerHTML = '';
  A.tokens.forEach((t, i) => {
    const s = document.createElement('span'); s.className = 'tok' + (S.token === i ? ' sel' : ''); s.textContent = t.label || '·';
    if (mass) { const v = mass[i] / vmax; const [r, g, b] = cmap(v); s.style.background = `rgba(${r|0},${g|0},${b|0},${(0.15 + 0.7 * v).toFixed(2)})`; s.title = `action-head mass ${mass[i].toExponential(2)}`; }
    s.onclick = () => { S.token = i; if ($('overlay').value !== 'vlm') { $('overlay').value = 'vlm'; fillHeads(); } drawCams(); drawTokens(); drawBudget(); };
    box.appendChild(s);
  });
  $('tokNote').textContent = mass ? `colour = action expert L${A.action.layer} mass on each token (${head < 0 || mode === 'vlm' ? 'mean over heads' : 'head ' + head}); click a token for its VLM L${A.vlm.layer} read` : '';
}

// ── drawing: budget ───────────────────────────────────────────────────────
function drawBudget() {
  const box = $('budget'); box.innerHTML = ''; if (!S.pred) { $('budgetNote').textContent = ''; return; }
  const A = S.pred.attention, mode = $('overlay').value;
  const legend = Object.entries(GROUP_COLORS).map(([k, c]) => `<span><i style="background:${c}"></i>${k.replace(/^img_/, '')}</span>`).join('');
  $('budgetLegend').innerHTML = legend;
  const bar = (label, parts) => { const row = document.createElement('div'); row.innerHTML = `<div>${label}</div>`; const b = document.createElement('div'); b.className = 'bar';
    for (const [k, v] of parts) { const s = document.createElement('span'); s.style.width = (100 * v).toFixed(2) + '%'; s.style.background = GROUP_COLORS[k] || '#888'; s.title = `${k}: ${(100 * v).toFixed(1)}%`; b.appendChild(s); }
    row.appendChild(b); box.appendChild(row); };
  if (mode === 'vlm' && A.vlm.budget && S.token !== null) {
    $('budgetNote').textContent = `VLM L${A.vlm.layer}, ${A.vlm.head < 0 ? 'mean over heads' : 'head ' + A.vlm.head}, query = "${A.tokens[S.token].label}"`;
    bar('selected token', Object.entries(A.vlm.budget).map(([k, v]) => [k, v[S.token]]));
    const N = A.tokens.length, avg = Object.entries(A.vlm.budget).map(([k, v]) => [k, v.reduce((a, b) => a + b, 0) / N]);
    bar('all prompt tokens (mean)', avg);
  } else if (A.action.budget) {
    const H = A.action.budget.other.length;
    $('budgetNote').textContent = `action expert L${A.action.layer}, per head, mean over the ${S.meta.chunk_size} action queries`;
    for (let h = 0; h < H; h++) bar('h' + h, Object.entries(A.action.budget).map(([k, v]) => [k, v[h]]));
  }
}

init().catch(e => setStatus(e.message, true));
</script>
</body>
