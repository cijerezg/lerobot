  setrep_view: attention_input
  setrep_layers: 8,14,20,28,32
  setrep_groups: img_external_0,img_wrist_0,state,subtask,action_output,action
  setrep_rebot_episodes: 3
  setrep_rebot_frames: 40
  setrep_external_episodes: 2
  setrep_external_frames: 20
  setrep_diverse_sources: droid_success:Franka,robochallenge:ARX5
  setrep_diverse_frames: 20
