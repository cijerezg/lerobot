  repr_max_frames: 1600
  repr_holdout_episodes: null
  repr_local_window_s: 2.0
  repr_stride_s: 2.0
  repr_min_frames_per_episode: 5
  repr_cross_matrices: true
  # Set representations (2026-10-22): 3 val eps x 40 frames, 2 external eps x 20, 2 diverse eps x 20
