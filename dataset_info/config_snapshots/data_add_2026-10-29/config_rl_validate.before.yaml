  depth_event_z_offset_mm: 30.0
  output_dir: outputs/probe
  mode: all
  max_episodes: 9
  n_frames_per_episode: 32
  random_seed: 42
  timestep: 0.5
  n_seeds: 4
  max_labels: 8
  # 2026-10-18: one grasp label per validation episode (rebot_val_2026-10-14-v1 ep0..ep8) so every sampled frame
  # can rank its true label, plus the clipper move/release and return. A frame whose true label is not swept gets no rank.
  subtask_sweep_labels:
  - grasp the black sock
  - grasp the nail clipper
  - grasp the headphone case lid
  - grasp the water bottle
  - grasp the outer edge of the flap with the bits
  - grasp the purple bottle
  - grasp the open pill bottle
  - grasp the cup
  - grasp the bit
  - move the nail clipper to the clipper case
  - release the nail clipper in the small slot
  - return to home
  subtask_scene_sweep_frames: migration/val_combine_2026-10-14/scene_sweep_frames.json
  precision_contact_sweep_frames: migration/precision_contact_sweep_frames/frames.json
  action_sensitivity_frames_per_subtask: 4
  action_sensitivity_projections: 1
  ref_max_episodes: 40
  ref_n_frames_per_episode: 256
  action_pca_dims: 50
  action_nn_state_k: 256
  repr_view: attention_input
  repr_layers: 14,28,32
  repr_groups: action,img_external_0,img_wrist_0,state
  repr_constant_text: true
