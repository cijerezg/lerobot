# Sim eval copy of config_rl.yaml (2026-10-17): env.robot = MuJoCo rebot_b601_sim on a recreated nail-clipper layout
# (lerobot/src/lerobot/robots/rebot_b601_sim/scenes), no leader (sim_autostart), task T085. Everything else is
# config_rl.yaml; keep the two in sync (regenerate: migration/real2sim_2026-10-17/scripts/make_sim_config.py).
# 2026-10-22: run_sim_eval.sh overrides policy.task / eval_subtasks / precisions / contacts per layout from the
# registry robots/rebot_b601_sim/tasks.py (tiers easy/hard, staged reward); the values below stay the nail task.
# One layout by hand:  MUJOCO_GL=egl uv run python -m lerobot.rl.inference_async --config_path=config_rl_sim.yaml [--env.robot.scene=ep1]
# Every layout on a checkpoint (what the chase runs on the Spark with remote_validate.sh --sim):
#   lerobot/scripts/run_sim_eval.sh outputs/<run>/checkpoints/<step>/pretrained_model
# BC dataset mix: diverse 25% / external ReBot 25% / internal ReBot 50% (2026-10-14, migration/sampling_mix_2026-10-14).
# Roots ending in -tasks1 / _tasks1 carry the 2026-10-14 task renames (migration/task_review_2026-10-14);
# -tasks2 / _tasks2 = the same plus three task strings shortened for the prompt token budget (migration/task_length_2026-10-14).
# Internal task shares use whole-episode groups; training-time validation stays off (Spark).
