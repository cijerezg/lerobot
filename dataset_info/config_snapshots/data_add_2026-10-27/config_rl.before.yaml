diverse:
  enabled: true
  # Approved usefulness cleanup; excludes action targets while preserving recovery history.
  # Internal (2026-10-16) + external ReBot and diverse (2026-10-18, migration/usefulness_review_ext_diverse_2026-10-18).
  rebot_exclusions_manifest: migration/usefulness_review_ext_diverse_2026-10-18/cleanup/rebot_exclusions.json
  diverse_exclusions_manifest: migration/usefulness_review_ext_diverse_2026-10-18/cleanup/diverse_exclusions.json
  root: outputs/diverse_robot_dataset_v3_round18_screen125_corrected_v4_tasks2
  cache_dir: outputs/buffer_cache-diverse-20261010
  # Mix 2026-10-26: back to 40/20/40 (as 2026-10-18): diverse 0.40, external ReBot 0.20, internal ReBot 0.40 (the group weights below). Starts inside a group are drawn iid.
  rebot_weight: 0.6
  weight: 0.4
  group_weight: sqrt_episodes
  group_weight_overrides: {}
  render_automatic_quality: false
  rebot_layout: rebot_b601_joint7_commanded
  rebot_depth_intrinsics:
  - 394.9832
  - 394.9832
  - 322.5604
  - 238.6966
  probe_rebot_caches: true
  # Shares are normalized by their sum: internal groups 0.40 + external 0.20 = rebot_weight 0.6, diverse 0.4.
  # 2026-10-21: bits 0.1232 -> 0.1366 for the internal_oct21 eps (usable bits frames 168,721 -> 187,006, old bits frames
  # keep their draw rate), other internal groups scaled by 0.9516 so the internal total stays 0.40 (external 0.20 cached, weight 0).
  # 2026-10-26: internal_oct26 adds usable frames rigid +25,620, bits_clippers +52,869, cases_kit_box_push +1,680. Each group weight
  # times (usable + new) / usable, then all six times 0.8464 so the internal total stays 0.40: every old frame keeps its draw rate
  # relative to every other frame (before-copy migration/data_add_2026-10-26/config_rl.before.yaml).
  # 2026-10-26 (user): rigid 23.2 -> 20.0 % of internal, the freed 0.01298 split evenly into bits_clippers and clothing.
  # Internal percentages: clothing 10.4, bits/clippers 38.7, rigid 20.0, bottles/lids 10.5, pills/caps 9.0, cases/kit/box/pushing 11.4.
  rebot_group_weights:
    clothing: 0.0418
    bits_clippers: 0.15479
    rigid: 0.08
    bottles_lids: 0.04188
    pills_caps: 0.03589
    cases_kit_box_push: 0.04564
    external_rebot: 0.2
    excluded: 0
