      bits_clippers: [0, 1, 2, 3, 4, 10]
      bottles_lids: [5, 6, 7, 8, 11]
      cases_kit_box_push: [9, 12]
  - name: internal_oct16
    root: outputs/rebot_2026-10-16-annotated-v1
    weight: 1.0
    sampling_group: internal
    normalization_source: false
