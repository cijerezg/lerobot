# Roots ending in -tasks1 / _tasks1 carry the 2026-10-14 task renames (migration/task_review_2026-10-14);
# -tasks2 / _tasks2 = the same plus three task strings shortened for the prompt token budget (migration/task_length_2026-10-14).
# Internal task shares use whole-episode groups; training-time validation stays off (Spark).
