    # merge of the 10-23 (0-6), 10-24 (7) and 10-26 (8-13) rollout roots and the 10-26 teleop roots (14-16 afternoon, 17-18 evening);
    # -v2 = the seven "Tidy up the table" episodes retasked (migration/data_add_2026-10-26). Basket tasks rigid, clippers/bits bits_clippers.
    episode_groups:
